name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore UrHmi.slnx
      - name: Build
        run: dotnet build UrHmi.slnx -c Release --no-restore
      - name: Test
        run: dotnet test UrHmi.slnx -c Release --no-build
